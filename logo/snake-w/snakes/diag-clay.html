<!doctype html>
<meta charset="utf-8">
<title>Snake W Diagnostics</title>
<!-- Neutral diagnostic renders of the scene (does not modify scene.js / geometry.js):
     builds the scene exactly as still.html does, then swaps every mesh material for
       clay   : matte grey, three directional lights (form only, no highlights)
       zebra  : grey mirror (metalness 1, roughness 0.04) in a PMREM'd "zebra" studio of
                parallel bright bars on a dark room (zebra = bands about world up,
                zebrav = bands about world x), so reflection lines expose kinks
       curv   : screen-space |dN|/|dP| of the interpolated normal, x tube radius 40 px
                (1 = a plain 40 px tube; colour ramp black-blue-green-yellow-red-white)
     and renders each mode at each view (full frame, or a crop box in reference pixels),
     returning PNG data URLs in window.__shots. Driven by tools/diag_still.mjs.
   Query: params, look, heads (as still.html); modes=clay,zebra,zebrav,curv;
          views=JSON {name:[x0,y0,x1,y1],...} ("full" is the whole frame);
          ss (supersample, default 2); cs (crop output scale, default 3);
          spec=spline.json: body from strandspline.js strandsFromSpec(spec) (as still-spline.html);
          geo=module.js: take the strands { yellow, blue } from that module's centrelines()
          (passed to createScene as `body`); bars (zebra bands per 180 deg, default 24);
          hide=shadow (default) | none -->
<style>html,body{margin:0;background:#222}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<canvas id="c" width="1448" height="1086"></canvas>
<script type="module">
import * as THREE from "three";
import { createScene, LOOK, FRAME } from "./scene.js";
const q = new URLSearchParams(location.search);
try {
const params = JSON.parse(await (await fetch(q.get("params") || "params.json")).text());
const bakedHeads = q.get("heads") && q.get("heads") !== "none" ? await (await fetch(q.get("heads"))).json() : null;
const look = structuredClone(LOOK);
if (q.get("look")) Object.assign(look, JSON.parse(q.get("look")));
let body = null;
if (q.get("geo")) {
  const G = await import("./" + q.get("geo"));
  const L = G.centrelines(params);
  body = { yellow: L.yellow, blue: L.blue };
}
// ?spec=spline-*.json: as still-spline.html: the spline body (strandspline.js) replaces
// centrelines()' strands; the spec's `tube` overrides params.tube
if (q.get("spec")) {
  const { strandsFromSpec } = await import("./strandspline.js");
  const spec = await (await fetch(q.get("spec"))).json();
  if (spec.tube) params.tube = { ...(params.tube || {}), ...spec.tube };
  body = strandsFromSpec(spec);
}
const t0 = performance.now();
const canvas = document.getElementById("c");
const extra = q.get("extra") ? await (await fetch(q.get("extra"))).json() : null;
const s = createScene(canvas, params, look, { still: true, bakedHeads, body, extra });
const tBuild = performance.now() - t0;
const { renderer, scene, camera, group } = s;
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
// hide everything that is not the model (painted shadows)
if ((q.get("hide") || "shadow") === "shadow")
  for (const o of scene.children) if (o !== group && !q.get("yaw")) o.visible = false;
// yaw / pitch / pivot (as still-spline.html): turn the model about a pivot in reference pixels
if (q.get("yaw")) {
  const [px, py] = (q.get("pivot") || "724,543").split(",").map(Number);
  const el = (params.cam.elev * Math.PI) / 180;
  const P = new THREE.Vector3(px, -py / Math.cos(el), 0);
  const pivot = new THREE.Group();
  scene.remove(group); pivot.add(group); group.position.copy(P).multiplyScalar(-1);
  pivot.position.copy(P); pivot.rotation.y = (Number(q.get("yaw")) * Math.PI) / 180;
  if (q.get("pitch")) pivot.rotation.x = (Number(q.get("pitch")) * Math.PI) / 180;
  scene.add(pivot);
  if ((q.get("hide") || "shadow") === "shadow") for (const o of scene.children) if (o !== pivot) o.visible = false;
}
const meshes = [];
group.traverse((o) => { if (o.isMesh) meshes.push(o); });

// ---- lights for clay
const lights = new THREE.Group();
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-0.55, 0.65, 0.55);
const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(0.7, 0.1, 0.7);
const top = new THREE.DirectionalLight(0xffffff, 0.6); top.position.set(0.1, 1, -0.2);
const hemi = new THREE.HemisphereLight(0xffffff, 0x404040, 0.55);
lights.add(key, fill, top, hemi);
scene.add(lights);

// ---- zebra studios: equirect bands about an axis, PMREM'd
function zebraEnv(axis, bars) {
  const W = 2048, H = 1024, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d"), img = g.createImageData(W, H);
  const period = Math.PI / bars;
  for (let y = 0; y < H; y++) {
    const lat = (0.5 - (y + 0.5) / H) * Math.PI;
    for (let x = 0; x < W; x++) {
      const lon = ((x + 0.5) / W - 0.5) * 2 * Math.PI;
      const d = [Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon)];
      const t = Math.asin(Math.max(-1, Math.min(1, d[0] * axis[0] + d[1] * axis[1] + d[2] * axis[2])));
      const f = ((t / period) % 1 + 1) % 1;
      // bright bar over 40% of each period, edges softened over ~1.5% of a period
      const e = 0.015, a = Math.min(1, Math.max(0, Math.min((f - 0.0) / e, (0.4 - f) / e)));
      const v = Math.round(255 * (0.04 + 0.96 * a));
      img.data.set([v, v, v, 255], 4 * (y * W + x));
    }
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping; tex.colorSpace = THREE.SRGBColorSpace;
  const pm = new THREE.PMREMGenerator(renderer);
  const out = pm.fromEquirectangular(tex).texture;
  pm.dispose(); tex.dispose();
  return out;
}
const bars = Number(q.get("bars") || 24);

// ---- materials
const clayMat = new THREE.MeshStandardMaterial({ color: 0xa8a8a8, roughness: 0.9, metalness: 0 });
const mirrorMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.04, metalness: 1 });
const curvMat = new THREE.ShaderMaterial({
  uniforms: { R0: { value: 40 } },
  vertexShader: `varying vec3 vN; varying vec3 vP;
    void main(){ vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz;
      gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `varying vec3 vN; varying vec3 vP; uniform float R0;
    vec3 ramp(float t){ t = clamp(t, 0.0, 1.0);
      vec3 c0 = vec3(0.0), c1 = vec3(0.1,0.2,0.9), c2 = vec3(0.1,0.8,0.3), c3 = vec3(1.0,0.9,0.1), c4 = vec3(1.0,0.15,0.1), c5 = vec3(1.0);
      float x = t * 5.0;
      if (x < 1.0) return mix(c0, c1, x); if (x < 2.0) return mix(c1, c2, x - 1.0);
      if (x < 3.0) return mix(c2, c3, x - 2.0); if (x < 4.0) return mix(c3, c4, x - 3.0); return mix(c4, c5, x - 4.0); }
    void main(){ vec3 n = normalize(vN);
      float kx = length(dFdx(n)) / max(length(dFdx(vP)), 1e-4);
      float ky = length(dFdy(n)) / max(length(dFdy(vP)), 1e-4);
      float k = max(kx, ky) * R0;       // 1 = a 40 px tube's cross-section curvature
      gl_FragColor = vec4(ramp(k / 3.0), 1.0);   // ramp spans k R0 = 0..3
      #include <colorspace_fragment>
    }`,
});
const MODES = {
  clay: { mat: clayMat, env: null, bg: 0xf2f2f2, lights: true },
  zebra: { mat: mirrorMat, env: () => zebraEnv([0, 1, 0], bars), bg: 0x303030, lights: false },
  zebrav: { mat: mirrorMat, env: () => zebraEnv([1, 0, 0], bars), bg: 0x303030, lights: false },
  curv: { mat: curvMat, env: null, bg: 0x000000, lights: false },
};

const views = q.get("views") ? JSON.parse(q.get("views")) : { full: [0, 0, FRAME.width, FRAME.height] };
const ss = Number(q.get("ss") || 2), cs = Number(q.get("cs") || 3);
const modes = (q.get("modes") || "clay,zebra").split(",");
const shots = [];
const half = [FRAME.width / 2, FRAME.height / 2];
for (const mode of modes) {
  const M = MODES[mode];
  if (!M) { console.log("unknown mode", mode); continue; }
  scene.environment = M.env ? M.env() : null;
  scene.environmentIntensity = 1;
  lights.visible = M.lights;
  renderer.setClearColor(M.bg);
  for (const m of meshes) m.material = M.mat;
  for (const [name, [x0, y0, x1, y1]] of Object.entries(views)) {
    const sc = name === "full" ? 1 : cs;
    const W = Math.round((x1 - x0) * sc), H = Math.round((y1 - y0) * sc);
    renderer.setPixelRatio(1);
    renderer.setSize(W * ss, H * ss, false);
    Object.assign(camera, { left: x0 - half[0], right: x1 - half[0], top: half[1] - y0, bottom: half[1] - y1 });
    camera.updateProjectionMatrix();
    s.render();
    const out = document.createElement("canvas"); out.width = W; out.height = H;
    const g = out.getContext("2d"); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
    g.drawImage(canvas, 0, 0, W, H);
    shots.push({ mode, view: name, data: out.toDataURL("image/png") });
  }
}
window.__info = { build_ms: Math.round(tBuild), total_ms: Math.round(performance.now() - t0) };
window.__shots = shots;
} catch (e) { console.log("diag error", e.stack || e.message); window.__error = String(e.stack || e); }
window.__ready = true;
</script>
