<!doctype html>
<meta charset="utf-8">
<title>Snake W Spline Still</title>
<style>html,body{margin:0;background:#fff}canvas{display:block;width:1448px;height:1086px}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<canvas id="c" width="1448" height="1086"></canvas>
<script type="module">
import * as THREE from "three";
import { createScene, LOOK } from "./scene.js";
import { strandsFromSpec } from "./strandspline.js";
const q = new URLSearchParams(location.search);
const paramsText = await (await fetch(q.get("params") || "params.json")).text();
const params = JSON.parse(paramsText);
const bakedHeads = q.get("heads") ? await (await fetch(q.get("heads"))).json() : null;
const look = structuredClone(LOOK);
if (q.get("look")) Object.assign(look, JSON.parse(q.get("look")));
// ?spec=spline-*.json: the spline body (strandspline.js) replaces centrelines()' strands; the
// spec's `tube` overrides params.tube (e.g. smooth 0: the spline is already smooth)
let body = null;
if (q.get("spec")) {
  const spec = await (await fetch(q.get("spec"))).json();
  if (spec.tube) params.tube = { ...(params.tube || {}), ...spec.tube };
  body = strandsFromSpec(spec);
}
const t0 = performance.now();
const s = createScene(document.getElementById("c"), params, look, { still: true, bakedHeads, body });
// look.softness: a slight photographic softness (px), as the reference's edges have
if (look.softness) document.getElementById("c").style.filter = `blur(${look.softness}px)`;
// ss=2: render at twice the resolution; the canvas is shown (and captured) at 1448 x 1086,
// so the browser filters it down: antialiasing even where the GPU gives none
s.renderer.setPixelRatio(Number(q.get("ss") || 1));
s.resize(1448, 1086);
if (q.get("yaw")) {
  // diagnostic views: turn the model about a pivot given in reference pixels (the hero
  // camera is not changed; the ground shadow stays where it was, so it is hidden)
  const [px, py] = (q.get("pivot") || "724,543").split(",").map(Number);
  const el = (params.cam.elev * Math.PI) / 180;
  const P = new THREE.Vector3(px, -py / Math.cos(el), 0);
  const pivot = new THREE.Group();
  s.scene.remove(s.group); pivot.add(s.group); s.group.position.copy(P).multiplyScalar(-1);
  pivot.position.copy(P); pivot.rotation.y = (Number(q.get("yaw")) * Math.PI) / 180;
  if (q.get("pitch")) pivot.rotation.x = (Number(q.get("pitch")) * Math.PI) / 180;
  s.scene.add(pivot);
  s.scene.traverse((o) => { if (o.isMesh && o.material && o.material.alphaMap) o.visible = false; });
}
s.render();
console.log("built in", Math.round(performance.now() - t0), "ms");
window.__ready = true;
</script>
