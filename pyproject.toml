[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.26,<0.10.0"]

[dependency-groups]
test = [
    "attrs>=25.1",
    "fsspec>=2024.2",
    "hypothesis>=6.140",
    "polars>=1.30",
    "pydantic>=2.11",
    "pytest>=8.4.0",
]

[project]
name = "wend"
version = "0.3.0"
description = "Templated paths using t-strings"
readme = "README.md"
authors = [
    {email = "louismmx@gmail.com", name = "Louis Maddox"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]
keywords = [
    "paths",
    "t-strings",
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
fsspec = [
    "fsspec>=2024.2",
]
polars = [
    "polars>=1.30",
]
pydantic = [
    "pydantic>=2.11",
]

[project.urls]
Homepage = "https://github.com/lmmx/wend"
Documentation = "https://lmmx.github.io/wend/"
Repository = "https://github.com/lmmx/wend.git"
Issues = "https://github.com/lmmx/wend/issues"

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "-v"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["C408", "C901", "E501", "E722", "E741"]
select = ["C", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["wend"]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E401", "F401"]

[tool.uv]
default-groups = ["test"]

[tool.uv.build-backend]
# Research prototypes (docs/journal), tested in the repository but not shipped
wheel-exclude = ["wend/_experimental"]
